<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MahaMelon">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0a1b14"/>
      <stop offset="100%" stop-color="#020706"/>
    </radialGradient>
    <linearGradient id="rind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9dffdf"/>
      <stop offset="100%" stop-color="#36b388"/>
    </linearGradient>
    <radialGradient id="flesh" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#bfffe6"/>
      <stop offset="100%" stop-color="#79ffd0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- melon body -->
  <circle cx="256" cy="262" r="150" fill="url(#flesh)"/>
  <circle cx="256" cy="262" r="150" fill="none" stroke="url(#rind)" stroke-width="20"/>

  <!-- rind netting / meridians -->
  <g stroke="#2f8f6c" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.55">
    <path d="M256 118 C 200 180, 200 344, 256 406"/>
    <path d="M256 118 C 312 180, 312 344, 256 406"/>
    <path d="M118 262 C 180 214, 332 214, 394 262"/>
    <path d="M118 262 C 180 310, 332 310, 394 262"/>
  </g>

  <!-- highlight -->
  <ellipse cx="208" cy="210" rx="46" ry="30" fill="#ffffff" opacity="0.35"/>

  <!-- leaf accent -->
  <path d="M300 128 C 338 96, 388 100, 404 128 C 372 150, 324 150, 300 128 Z" fill="url(#rind)"/>
</svg>
